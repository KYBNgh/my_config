music_directory     "$XDG_MUSIC_DIR"
playlist_directory  "~/.local/share/mpd/playlists"

db_file             "~/.local/state/mpd/database"
state_file          "~/.local/state/mpd/state"
sticker_file        "~/.local/share/mpd/sticker.sql"

auto_update         "yes"
restore_paused      "yes"
zeroconf_enabled    "no"

audio_output {
    type        "pipewire"
    name        "PipeWire"
    mixer_type  "software"
    #target     "alsa_output.pci-0000_0b_00.4.analog-stereo"  # 可选：固定输出设备，pactl list short sinks 查
}

audio_output {
    type   "fifo"
    name   "visualizer"
    path   "$XDG_RUNTIME_DIR/mpd.fifo"
    format "44100:16:2"
}
